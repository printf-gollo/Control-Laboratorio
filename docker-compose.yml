services:
  db_mysql:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password
    container_name: prestamos_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
